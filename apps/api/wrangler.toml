name = "skillpage-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "skillpage-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# R2 File Storage
[[r2_buckets]]
binding = "FILES"
bucket_name = "skillpage-files"

# Queues
[[queues.producers]]
queue = "skillpage-email-queue"
binding = "EMAIL_QUEUE"

# Environment variables (set secrets via wrangler secret)
[vars]
ENVIRONMENT = "development"

# Dev-only vars (use .dev.vars for local secrets)
# JWT_SECRET, STRIPE_SECRET_KEY, TURNSTILE_SECRET go in .dev.vars
